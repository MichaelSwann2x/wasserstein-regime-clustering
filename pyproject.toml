[project]
name = "wasserstein-regime-clustering"
version = "0.2.0"
description = "Improved Wasserstein K-Means market regime clustering (Horvath et al. 2021). Vectorized 1-D OT, streaming windows, transition stats, clean API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Improved from mirkovicdev implementation of Horvath-Issa-Muguruza 2021" }
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4", "matplotlib>=3.7"]
viz = ["matplotlib>=3.7", "seaborn>=0.13"]
full = ["yfinance>=0.2", "tqdm>=4.66"]

[project.urls]
Source = "https://github.com/MichaelSwann2x/wasserstein-regime-clustering"
Original = "https://github.com/mirkovicdev/CLUSTERING-MARKET-REGIMES"
Paper = "https://arxiv.org/abs/2110.11848"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wasserstein_regime"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
